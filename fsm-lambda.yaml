          CORS_ORIGIN: !Ref CloudFrontUrl

  # Agents API Options Handler Function
  AgentsApiOptionsHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FSM-AgentsApiOptionsHandler-${Environment}'
      Handler: agentsApiHandler.optionsHandler
      Role: !GetAtt AgentsApiRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub '${LambdaCodePrefix}/agentsApiHandler.zip'
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CORS_ORIGIN: !Ref CloudFrontUrl
  
  SimulatorControlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FSM-SimulatorControlFunction-${Environment}'
      Handler: simulatorControlFunction.handler
      Role: !GetAtt ApiDataAccessRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub '${LambdaCodePrefix}/simulatorControlFunction.zip'
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          SIMULATOR_CONFIG_TABLE: !Sub 'FSM-SimulatorConfig-${Environment}'
          ENVIRONMENT: !Ref Environment
          USER_POOL_ID: !Ref UserPoolId
          USER_POOL_CLIENT_ID: !Ref UserPoolClientId
          CORS_ORIGIN: !Ref CloudFrontUrl 



