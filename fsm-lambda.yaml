AWSTemplateFormatVersion: '2010-09-09'
Description: 'Field Service Management (FSM) Application - Lambda Functions'

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda function code
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues:
      - 'dev'
      - 'test'
      - 'prod'
    Description: Deployment environment
  
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
  
  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client ID
    
  CloudFrontUrl:
    Type: String
    Description: The exact CloudFront origin (https://...) allowed by CORS. Wildcards are rejected.
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    ConstraintDescription: Must be a single https:// origin without path or trailing slash

  LambdaCodePrefix:
    Type: String
    Default: lambda
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    Description: Versioned S3 key prefix containing this release's Lambda packages

  AgentRuntimeArns:
    Type: String
    Description: JSON object mapping the eight FSM semantic agent keys to READY AgentCore runtime ARNs
    MinLength: 2

Resources:
  # ---------------------------------------------------------------------------
  # IAM: one narrowly scoped execution role per workload. No role grants access
  # to resources outside this account, region, and environment.
  # ---------------------------------------------------------------------------

  # Role for the REST data handlers (customers, jobs, technicians, invoices,
  # metrics, parts, simulator control) and the data-population custom resource.
  ApiDataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'FSM ${Environment} REST data handlers - environment-scoped DynamoDB access only'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: FsmTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteFsmTables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Customers-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Jobs-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Technicians-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Invoices-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Metrics-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Metrics-${Environment}/index/*'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Parts-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Documentation-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-SimulatorConfig-${Environment}'

  # Role for the WebSocket connect/disconnect/message handlers.
  WebSocketHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'FSM ${Environment} WebSocket handlers - connection table and connection management only'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: WebSocketConnections
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectionTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-WebSocketConnections-${Environment}'
              - Sid: ManageConnections
                Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/@connections/*'

  # Role for the WebSocket $connect authorizer: logs only. It verifies JWTs
  # against the public user pool JWKS and needs no AWS data access.
  WebSocketAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'FSM ${Environment} WebSocket $connect authorizer - CloudWatch Logs only'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # Role for the realtime fan-out workers (metrics simulator, DynamoDB stream
  # handler): read source tables, write metrics, push to WebSocket clients.
  RealtimeBroadcastRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'FSM ${Environment} realtime broadcast workers - metrics/simulator tables, stream read, WebSocket push'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: RealtimeBroadcast
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSourceTables
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Customers-${Environment}'
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-SimulatorConfig-${Environment}'
              - Sid: WriteMetrics
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Metrics-${Environment}'
              - Sid: ConnectionTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-WebSocketConnections-${Environment}'
              - Sid: ReadMetricsStream
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FSM-Metrics-${Environment}/stream/*'
              - Sid: ManageConnections
                Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/@connections/*'

  # Role for the agents API proxy: invoke only FSM AgentCore runtimes and read
  # their log groups. No DynamoDB access.
  AgentsApiRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'FSM ${Environment} agents API - invoke FSM AgentCore runtimes and read their logs'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: AgentCoreRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeFsmRuntimes
                Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/fsm_*'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/fsm_*/runtime-endpoint/*'
              - Sid: ReadAgentCoreRuntimeLogs
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/fsm_*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/fsm_*:*'

  # Lambda Functions
  CustomerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FSM-CustomerFunction-${Environment}'
      Handler: customerFunction.getAllCustomers
      Role: !GetAtt ApiDataAccessRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub '${LambdaCodePrefix}/customerFunction.zip'
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          CUSTOMERS_TABLE: !Sub 'FSM-Customers-${Environment}'
          ENVIRONMENT: !Ref Environment
          USER_POOL_ID: !Ref UserPoolId
          USER_POOL_CLIENT_ID: !Ref UserPoolClientId
          CORS_ORIGIN: !Ref CloudFrontUrl

  CustomerByIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'FSM-CustomerByIdFunction-${Environment}'
