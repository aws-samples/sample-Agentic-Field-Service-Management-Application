AWSTemplateFormatVersion: '2010-09-09'
Description: 'Field Service Management (FSM) Application - API Gateway'

Parameters:
  ApiStageName:
    Type: String
    Default: 'prod'
    Description: API Gateway stage name
  
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues:
      - 'dev'
      - 'test'
      - 'prod'
    Description: Deployment environment
  
  LambdaFunctionsStackName:
    Type: String
    Description: Name of the Lambda functions stack
    
  CloudFrontUrl:
    Type: String
    Description: CloudFront distribution domain name (no scheme) used as the single allowed CORS origin
    AllowedPattern: '^[A-Za-z0-9.-]+$'
    ConstraintDescription: Must be a bare domain name such as d1234abcd.cloudfront.net


  UserPoolArn:
    Type: String
    Description: ARN of the Cognito user pool whose ID tokens the REST authorizer accepts
    AllowedPattern: '^arn:aws[a-z-]*:cognito-idp:[a-z0-9-]+:[0-9]{12}:userpool/[A-Za-z0-9_-]+$'

  DeploymentNonce:
    Type: String
    Description: Release-unique value; changing it forces a new REST API deployment so method auth changes reach the stage

  ApiThrottleRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second allowed per stage (replaces the API key usage plan)

  ApiThrottleBurstLimit:
    Type: Number
    Default: 100
    Description: Burst request limit per stage

Resources:
  # REST API Gateway
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'FSM-API-${Environment}'
      Description: Field Service Management API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Cognito User Pools authorizer for every non-OPTIONS REST method.
  # Expects the Cognito ID token in the Authorization header.
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub 'FSM-Cognito-${Environment}'
      RestApiId: !Ref RestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Ref UserPoolArn

  # API Resources
  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'customers'

  CustomerByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref CustomersResource
      PathPart: '{id}'

  JobsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'jobs'

  JobByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref JobsResource
      PathPart: '{id}'

  JobAssignResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref JobByIdResource
      PathPart: 'assign'

  JobUnassignResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref JobByIdResource
      PathPart: 'unassign'

  JobCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref JobByIdResource
      PathPart: 'complete'

  TechniciansResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'technicians'

  TechnicianByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref TechniciansResource
      PathPart: '{id}'

  InvoicesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'invoices'

  InvoiceByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref InvoicesResource
      PathPart: '{id}'

  MetricsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'metrics'
  
  MetricsByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref MetricsResource
      PathPart: '{id}'


  PartsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: 'parts'
      
  PartsReorderResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PartsResource
      PathPart: 'reorder'
  
  PartsByHvacResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PartsResource
      PathPart: 'hvac-model'
  
  PartsByHvacIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PartsByHvacResource
      PathPart: '{id}'
  
  PartsInventoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref PartsResource
      PathPart: 'inventory'

  SimulatorResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: simulator
  
  # Gateway Responses for CORS
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${CloudFrontUrl}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${CloudFrontUrl}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
