    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue 
        Fn::Sub: "${LambdaFunctionsStackName}-SimulatorControlFunctionArn"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*

Outputs:
  StackName:
    Description: Name of this stack
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${AWS::StackName}-StackName'
      
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ApiId:
    Description: ID of the API Gateway
    Value: !Ref RestApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  WebSocketEndpoint:
    Description: WebSocket API endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}'
    Export:
      Name: !Sub '${AWS::StackName}-WebSocketEndpoint'

  CustomerFunctionArn:
    Description: ARN of the Customer Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-CustomerFunctionArn"

  CustomerByIdFunctionArn:
    Description: ARN of the CustomerById Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-CustomerByIdFunctionArn"

  JobsFunctionArn:
    Description: ARN of the Jobs Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-JobsFunctionArn"

  JobByIdFunctionArn:
    Description: ARN of the JobById Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-JobByIdFunctionArn"

  AssignTechnicianFunctionArn:
    Description: ARN of the AssignTechnician Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-AssignTechnicianFunctionArn"

  CompleteJobFunctionArn:
    Description: ARN of the CompleteJob Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-CompleteJobFunctionArn"

  TechniciansFunctionArn:
    Description: ARN of the Technicians Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-TechniciansFunctionArn"

  MetricsFunctionArn:
    Description: ARN of the Metrics Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-MetricsFunctionArn"

  WebSocketConnectFunctionArn:
    Description: ARN of the WebSocketConnect Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-WebSocketConnectFunctionArn"

  WebSocketDisconnectFunctionArn:
    Description: ARN of the WebSocketDisconnect Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-WebSocketDisconnectFunctionArn"

  WebSocketMessageFunctionArn:
    Description: ARN of the WebSocketMessage Lambda function
    Value: !ImportValue 
      Fn::Sub: "${LambdaFunctionsStackName}-WebSocketMessageFunctionArn"

  MetricsResourceId:
    Description: Resource ID for Metrics Lambda function
    Value: !Ref MetricsResource
    Export:
      Name: !Sub '${AWS::StackName}-MetricsResourceId'

 


