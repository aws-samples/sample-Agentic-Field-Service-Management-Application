  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetCustomersMethod
      - GetCustomerByIdMethod
      - GetJobsMethod
      - GetJobByIdMethod
      - AssignTechnicianMethod
      - UnassignTechnicianMethod
      - JobUnassignOptionsMethod
      - CompleteJobMethod
      - GetTechniciansMethod
      - CustomersOptionsMethod
      - CustomerByIdOptionsMethod
      - JobsOptionsMethod
      - JobByIdOptionsMethod
      - JobAssignOptionsMethod
      - JobCompleteOptionsMethod
      - TechniciansOptionsMethod
      - TechnicianByIdOptionsMethod
      - GetInvoicesMethod
      - GetInvoiceByIdMethod
      - InvoicesOptionsMethod
      - InvoiceByIdOptionsMethod
      - GetMetricsByIdMethod
      - MetricsByIdOptionsMethod
      - GetPartsMethod
      - GetPartsByHvacMethod
      - PartsByHvacOptionsMethod
      - GetPartsByHvacIdMethod
      - PartsByHvacIdOptionsMethod
      - GetPartsReorderMethod
      - PartsReorderPostMethod
      - PartsOptionsMethod
      - PartsReorderOptionsMethod
      - PartsInventoryrPostMethod
      - PartsInventoryOptionsMethod
      - AgentTypePostMethod
      - AgentTypeOptionsMethod
      - SimulatorStatusMethod
      - SimulatorStartMethod
      - SimulatorStopMethod
      - SimulatorOptionsMethod
      - WebSocketConnectRoute
      - WebSocketDisconnectRoute
      - WebSocketDefaultRoute
      - CognitoAuthorizer
      
    Properties:
      RestApiId: !Ref RestApi
      # A Deployment is only recreated when its properties change; tie it to the release
      # so authorizer and method changes always reach the stage.
      Description: !Sub 'FSM API release ${DeploymentNonce}'
      StageName: !Ref ApiStageName
      StageDescription:
        MethodSettings:
          - ResourcePath: '/*'
            HttpMethod: '*'
            ThrottlingRateLimit: !Ref ApiThrottleRateLimit
            ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit

  # WebSocket API for real-time updates
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'FSM-WebSocketAPI-${Environment}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref ApiStageName
      AutoDeploy: true

  # $connect is the only WebSocket route API Gateway lets you authorize; the
  # authorizer verifies the Cognito ID token passed as ?token=.
  WebSocketAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebSocketApi
      Name: !Sub 'FSM-WebSocketCognito-${Environment}'
      AuthorizerType: REQUEST
      IdentitySource:
        - route.request.querystring.token
      AuthorizerUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunctionArn}/invocations
        - AuthorizerFunctionArn: !ImportValue
            Fn::Sub: "${LambdaFunctionsStackName}-WebSocketAuthorizerFunctionArn"

  WebSocketAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue
        Fn::Sub: "${LambdaFunctionsStackName}-WebSocketAuthorizerFunctionArn"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/authorizers/${WebSocketAuthorizer}'

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WebSocketAuthorizer
      OperationName: ConnectRoute
      Target: !Sub 'integrations/${WebSocketConnectIntegration}'

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target: !Sub 'integrations/${WebSocketDisconnectIntegration}'

  WebSocketDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      OperationName: DefaultRoute
      Target: !Sub 'integrations/${WebSocketMessageIntegration}'

  WebSocketConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketConnectFunctionArn}/invocations
        - WebSocketConnectFunctionArn: !ImportValue 
            Fn::Sub: "${LambdaFunctionsStackName}-WebSocketConnectFunctionArn"

  WebSocketDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
